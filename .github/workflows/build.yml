name: 'Build'

on:
  push:
    branches:
      - dev
    tags:
      - '*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v3

      - name: 'Build firmware'
        run: |
          docker run \
              -v $(pwd):/src \
              ghcr.io/drunkbatya/binutils-z80-elf:2.45 \
                  bash -c 'cd /src/software && make'

      - name: 'Build updater image'
        run: |
          docker run \
              -v $(pwd):/src \
              ghcr.io/drunkbatya/binutils-z80-elf:2.45 \
                  bash -c 'cd /src/software && make updater_image'

      - name: 'Build emulator dist'
        run: |
          docker run \
              -v $(pwd):/src \
              ghcr.io/drunkbatya/binutils-z80-elf:2.45 \
                  bash -c 'cd /src/software && make emulator_dist'

      - name: 'Prepare artifacts dir'
        run: |
          rm -rf artifacts
          mkdir -p artifacts

      - name: 'Package the emulator dist'
        run: |
          cp emulator artifacts/emulator  # this need to follow emulator symlinks for software dir

      - name: 'Upload emulator dist to GitHub pages'
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/emulator

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 'Deploy emulator to GitHub Pages'
        id: deployment
        uses: actions/deploy-pages@v4

